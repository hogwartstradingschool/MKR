plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.mkr.player'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mkr.app'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }   // sirf phone wali ABIs => APK chhota
    }
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['/META-INF/**', '/kotlin/**', 'DebugProbesKt.bin'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8; coreLibraryDesugaringEnabled true }
    kotlinOptions { jvmTarget = '1.8' }
    lint { abortOnError false; checkReleaseBuilds false }
    dependenciesInfo { includeInApk false; includeInBundle false }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+1'
    // Video Grabber engine (yt-dlp + ffmpeg)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.2'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2'
}
